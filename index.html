<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRM | THĂNG LONG GROUP</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 500px;" id="login-section">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4 text-primary fw-bold">HRM TLG LOGIN</h3>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Email công việc</label>
            <input type="email" id="email" class="form-control" placeholder="user@company.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
        <div id="login-alert" class="mt-3"></div>
      </div>
    </div>
  </div>

  <div class="container py-4 d-none" id="app-section">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="text-primary mb-0">HỆ THỐNG HRM</h4>
      <div>
        <span id="user-info" class="me-3 fw-bold"></span>
        <button id="logout-btn" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5>Bảng điều khiển</h5>
        <p class="text-muted">Chào mừng anh/chị đã đăng nhập thành công vào hệ thống. Các phân quyền RLS trên Supabase đang tự động bảo vệ dữ liệu của anh.</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://shwkrrcvbmbrjzxgoiwt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3dBkTWNW_4xgzeZzTSa0ig_RFkSjO0a';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Xử lý Đăng nhập
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertDiv = document.getElementById('login-alert');

      alertDiv.innerHTML = '<div class="alert alert-info">Đang xác thực...</div>';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alertDiv.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
      } else {
        alertDiv.innerHTML = '';
        checkAuth();
      }
    });

    // Xử lý Đăng xuất
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      checkAuth();
    });

    // Kiểm tra trạng thái Đăng nhập
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('login-section').classList.add('d-none');
        document.getElementById('app-section').classList.remove('d-none');
        document.getElementById('user-info').innerText = session.user.email;
      } else {
        document.getElementById('login-section').classList.remove('d-none');
        document.getElementById('app-section').classList.add('d-none');
      }
    }

    checkAuth();
  </script>
</body>
</html>
