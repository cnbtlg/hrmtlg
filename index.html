<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRM | THĂNG LONG GROUP</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Style CSS riêng của dự án -->
  <link rel="stylesheet" href="./assets/css/style.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS (xlsx) để xuất file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

  <!-- ================= MÀN HÌNH ĐĂNG NHẬP ================= -->
  <div class="container py-5 login-container" id="login-section">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4 text-primary fw-bold">HRM TLG LOGIN</h3>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email công việc</label>
            <input type="email" id="email" class="form-control" placeholder="user@company.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng nhập</button>
        </form>
        <div id="login-alert" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- ================= MÀN HÌNH CHÍNH (SAU KHI ĐĂNG NHẬP) ================= -->
  <div class="container py-4 d-none" id="app-section">
    <!-- THANH HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h4 class="text-primary mb-0 fw-bold">HỆ THỐNG QUẢN LÝ NHÂN SỰ - THĂNG LONG GROUP</h4>
      <div>
        <span id="user-info" class="me-3 fw-semibold text-secondary"></span>
        <button id="logout-btn" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
      </div>
    </div>

    <!-- KHU VỰC BẢNG NHÂN SỰ -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0 text-dark fw-bold">📋 Danh Sách Nhân Sự</h5>
        <div>
          <button class="btn btn-primary btn-sm fw-bold me-2" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">➕ Thêm nhân viên</button>
          <button id="export-excel-btn" class="btn btn-success btn-sm fw-bold">📥 Xuất File Excel</button>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Mã NV (00000)</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Phân quyền</th>
                <th>Chức danh</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="employee-table-body">
              <tr>
                <td colspan="6" class="text-center text-muted py-4">Đang tải dữ liệu nhân sự...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= MODAL THÊM NHÂN SỰ MỚI ================= -->
  <div class="modal fade" id="addEmployeeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-primary">Thêm Nhân Sự Mới (Mã 5 chữ số)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="add-employee-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Mã nhân viên (5 chữ số: 00001, 00002...)</label>
              <input type="text" id="new-emp-code" class="form-control" maxlength="5" placeholder="Để trống sẽ tự sinh tuần tự">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và Tên</label>
              <input type="text" id="new-emp-name" class="form-control" required placeholder="Nguyễn Văn A">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email công việc (Đăng nhập)</label>
              <input type="email" id="new-emp-email" class="form-control" required placeholder="user@company.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mật khẩu ban đầu</label>
              <input type="password" id="new-emp-password" class="form-control" required placeholder="Ít nhất 6 ký tự">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Phân quyền (Role)</label>
              <select id="new-emp-role" class="form-select">
                <option value="EMPLOYEE">Nhân viên (EMPLOYEE)</option>
                <option value="MANAGER">Quản lý (MANAGER)</option>
                <option value="CB">C&B / Nhân sự (CB)</option>
                <option value="BGD">Ban Giám Đốc (BGD)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Lưu nhân sự</button>
          </form>
          <div id="add-emp-alert" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (Cần cho Modal hoạt động) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- File Javascript logic chính -->
  <script src="./assets/js/app.js"></script>
</body>
</html>
