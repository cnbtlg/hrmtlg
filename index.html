<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRM | THĂNG LONG GROUP</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS (xlsx) để xuất file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div class="container py-5" style="max-width: 500px;" id="login-section">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4 text-primary fw-bold">HRM TLG LOGIN</h3>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Email công việc</label>
            <input type="email" id="email" class="form-control" placeholder="user@company.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
        <div id="login-alert" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- MÀN HÌNH CHÍNH SAU KHI ĐĂNG NHẬP -->
  <div class="container py-4 d-none" id="app-section">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h4 class="text-primary mb-0 fw-bold">HỆ THỐNG QUẢN LÝ NHÂN SỰ - THĂNG LONG GROUP</h4>
      <div>
        <span id="user-info" class="me-3 fw-semibold text-secondary"></span>
        <button id="logout-btn" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
      </div>
    </div>

    <!-- KHU VỰC CHỨC NĂNG QUẢN LÝ NHÂN SỰ -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0 text-dark fw-bold">📋 Danh Sách Nhân Sự</h5>
        <button id="export-excel-btn" class="btn btn-success btn-sm">📥 Xuất File Excel</button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Mã NV</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Chức vụ (Role)</th>
                <th>Chức danh</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="employee-table-body">
              <tr>
                <td colspan="6" class="text-center text-muted">Đang tải dữ liệu nhân sự...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://shwkrrcvbmbrjzxgoiwt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3dBkTWNW_4xgzeZzTSa0ig_RFkSjO0a';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentEmployeesData = [];

    // Xử lý Đăng nhập
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertDiv = document.getElementById('login-alert');

      alertDiv.innerHTML = '<div class="alert alert-info py-2">Đang xác thực...</div>';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alertDiv.innerHTML = `<div class="alert alert-danger py-2">${error.message}</div>`;
      } else {
        alertDiv.innerHTML = '';
        checkAuth();
      }
    });

    // Xử lý Đăng xuất
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      checkAuth();
    });

    // Kiểm tra trạng thái Đăng nhập & Tải dữ liệu
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('login-section').classList.add('d-none');
        document.getElementById('app-section').classList.remove('d-none');
        document.getElementById('user-info').innerText = `Tài khoản: ${session.user.email}`;
        
        // Gọi hàm tải danh sách nhân sự
        loadEmployees();
      } else {
        document.getElementById('login-section').classList.remove('d-none');
        document.getElementById('app-section').classList.add('d-none');
      }
    }

    // Tải danh sách nhân sự từ Supabase (Được bảo vệ bởi RLS)
    async function loadEmployees() {
      const tbody = document.getElementById('employee-table-body');
      const { data, error } = await supabaseClient
        .from('employees')
        .select('*')
        .order('employee_code', { ascending: true });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Lỗi tải dữ liệu: ${error.message}</td></tr>`;
        return;
      }

      currentEmployeesData = data; // Lưu lại để xuất Excel

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Chưa có dữ liệu nhân sự nào trong hệ thống.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      data.forEach(emp => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="fw-semibold text-primary">${emp.employee_code || ''}</span></td>
          <td>${emp.full_name || ''}</td>
          <td>${emp.email || ''}</td>
          <td><span class="badge bg-secondary">${emp.role || 'EMPLOYEE'}</span></td>
          <td>${emp.job_title || '-'}</td>
          <td><span class="badge ${emp.status === 'ACTIVE' ? 'bg-success' : 'bg-warning'}">${emp.status || 'ACTIVE'}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Chức năng Xuất Excel
    document.getElementById('export-excel-btn').addEventListener('click', () => {
      if (!currentEmployeesData || currentEmployeesData.length === 0) {
        alert('Không có dữ liệu để xuất!');
        return;
      }

      // Chuẩn hóa dữ liệu sang tiếng Việt cho file Excel đẹp mắt
      const excelData = currentEmployeesData.map((emp, index) => ({
        "STT": index + 1,
        "Mã NV": emp.employee_code,
        "Họ và Tên": emp.full_name,
        "Email": emp.email,
        "Phân quyền (Role)": emp.role,
        "Chức danh": emp.job_title || "",
        "Trạng thái": emp.status,
        "Ngày vào làm": emp.joined_date || ""
      }));

      // Tạo workbook và worksheet bằng SheetJS
      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "DanhSachNhanSu");

      // Tải file về máy
      XLSX.writeFile(workbook, `DanhSachNhanSu_TLG_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    checkAuth();
  </script>
</body>
</html>
